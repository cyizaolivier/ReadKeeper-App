<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReadKeeper - Members</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>

<div class="app-container">
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="brand">
        <i data-feather="book-open" style="color:var(--primary)"></i> ReadKeeper
        </div>
        
        <nav class="nav-links">
        <a href="index.html" class="nav-item">
            <i data-feather="grid"></i> Dashboard
        </a>
        <a href="library.html" class="nav-item">
            <i data-feather="list"></i> My Books
        </a>
        <a href="#" class="nav-item active">
            <i data-feather="users"></i> Members
        </a>
        <a href="settings.html" class="nav-item">
            <i data-feather="settings"></i> Settings
        </a>
        </nav>
    
        <div class="user-profile">
            <div class="avatar"><i data-feather="user"></i></div>
            <div style="flex:1">
                <div style="font-size:0.9rem; font-weight:600;" id="welcomeMembers">User</div>
                <div style="font-size:0.75rem; color:#94a3b8;">Logged in</div>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <header class="flex-between mb-4">
            <div>
                <h1 style="font-size:1.5rem; font-weight:800; text-transform:uppercase; letter-spacing:0.05em;">Members</h1>
                <p style="color:var(--text-muted); font-size:0.85rem;">User Directory</p>
            </div>
            <div style="display:flex; gap:10px; align-items:center;">
                <button id="logoutBtn" class="btn btn-danger btn-sm">
                    <i data-feather="log-out"></i> Logout
                </button>
            </div>
        </header>

        <!-- MEMBER LIST -->
        <div class="card">
            <div class="card-header flex-between">
                <h3 style="font-size:1.1rem; font-weight:600;">Registered Members</h3>
                <span id="memberCount" class="badge badge-success" style="font-size:0.85rem">0 Users</span>
            </div>
            <div style="padding:1.5rem;">
                <div id="membersGrid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:1.5rem;">
                    <!-- Members injected here -->
                </div>
            </div>
        </div>

    </main>
</div>

<script src="script.js"></script> <!-- Reusing script.js but adding logic -->
<script>
    feather.replace();
    
    // Inline logic for members page (since it's specific) or we can move to script.js
    // Moving key logic to script.js is cleaner, but for this page's specific rendering, we might need a specific function called.
    // I will add 'renderMembers' to script.js and call it if we are on this page.
    
    // Simple page detection or init
    if(window.renderMembers) window.renderMembers();
    
    const currentUser = JSON.parse(localStorage.getItem('currentUser'));
    if(currentUser) document.getElementById('welcomeMembers').textContent = currentUser.username;
    
    // Theme toggle reuse
    const themeBtn = document.getElementById('themeToggle');
    themeBtn.addEventListener('click', () => {
         document.body.classList.toggle('dark'); // basic toggle if script.js logic isn't fully bound yet to this specific button
         // Actually script.js binds to 'themeBtn' OR we need to update script.js to generic class
         // Relying on script.js updates in next step
    });
    
    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('currentUser');
        window.location.href = 'index.html';
    });
</script>
</body>
</html>
